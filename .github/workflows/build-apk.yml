
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FloatingMenuDemo_cloud_build.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip FloatingMenuDemo_cloud_build.zip
          cd FloatingMenuDemo
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingMenuDemo-debug-apk
          path: FloatingMenuDemo/app/build/outputs/apk/debug/app-debug.apk
          
